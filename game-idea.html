<!doctype html>

<head>

<title>Cardsharp — Wire Map</title>
<style>
:root {
  --ink: #22262b; --ink-soft: #565c63; --paper: #edeee6; --paper-raised: #f6f6f0;
  --moss: #3f6b4f; --hairline: #cfd0c5;
  --n-theme: #22262b; --n-concept: #4a4e9c; --n-topic: #b8783f; --n-keyword: #6b6f76; --n-source: #2e7d6b;
  --font-display: "Source Serif 4", Georgia, serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font-body); color: var(--ink); background: var(--paper); display: flex; }

.sidebar { width: 270px; flex-shrink: 0; height: 100vh; overflow-y: auto; padding: 20px; border-right: 1px solid var(--hairline); background: var(--paper); }
.sidebar h1 { font-family: var(--font-display); font-size: 20px; margin: 0 0 2px; }
.sidebar .tagline { color: var(--ink-soft); font-size: 13px; margin: 0 0 6px; }
.sidebar .export-note { color: var(--ink-soft); font-size: 11px; margin: 0 0 20px; }
.field-label { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); display: block; margin-bottom: 6px; }
.nav-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
button.nav-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; background: transparent; color: var(--ink); border: none; border-left: 3px solid var(--n-topic); border-radius: 2px; padding: 7px 10px; font-size: 13px; font-family: var(--font-body); cursor: pointer; }
button.nav-item:hover { background: white; }
button.nav-item.active { background: white; font-weight: 600; }
button.nav-item.nav-root { border-left-color: var(--n-theme); margin-bottom: 4px; }
.nav-item .nav-count { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); }

.canvas-area { position: relative; flex: 1; height: 100vh; overflow: hidden; cursor: grab; background-image: radial-gradient(var(--hairline) 1px, transparent 1px); background-size: 16px 16px; }
.canvas-area.dragging { cursor: grabbing; }
.viewport { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.edge-label { position: absolute; transform: translate(-50%, -50%); background: white; border: 1px solid var(--hairline); border-radius: 3px; padding: 1px 5px; font-size: 10px; color: var(--ink-soft); white-space: nowrap; pointer-events: none; }

.kmap-node { position: absolute; width: 190px; background: white; border: 1px solid var(--hairline); border-left: 3px solid var(--stripe); border-radius: 3px; padding: 8px 10px; font-size: 12px; cursor: pointer; box-shadow: 1px 1px 0 rgba(34,38,43,.05); }
.kmap-node:hover { box-shadow: 2px 2px 0 rgba(34,38,43,.12); }
.kmap-node .node-type { font-size: 9px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); }
.kmap-node .node-name { font-weight: 600; margin: 2px 0 3px; line-height: 1.25; }
.kmap-node .node-desc { color: var(--ink-soft); font-size: 11px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.kmap-node.selected { outline: 2px solid var(--moss); outline-offset: 1px; }
.kmap-node-structural .node-name { font-family: var(--font-display); font-size: 14px; }

.zoom-controls { position: absolute; bottom: 16px; left: 16px; display: flex; flex-direction: column; gap: 4px; }
.zoom-controls button { width: 28px; height: 28px; background: white; border: 1px solid var(--hairline); border-radius: 3px; cursor: pointer; font-size: 14px; }

.detail-drawer { position: absolute; top: 0; right: 0; width: 320px; height: 100%; background: var(--paper-raised); border-left: 1px solid var(--hairline); overflow-y: auto; padding: 20px; }
.detail-drawer .close-btn { float: right; }
.detail-drawer h2 { font-family: var(--font-display); font-size: 19px; margin: 4px 0 8px; clear: both; }
.detail-drawer .node-type { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); }
.detail-drawer p { font-size: 13px; line-height: 1.5; }
.section-label { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); margin: 18px 0 6px; }
.connection-row { font-size: 12px; padding: 6px 0; border-top: 1px solid var(--hairline); }
.connection-row .rel-type { color: var(--ink-soft); font-size: 11px; }
.source-row { font-size: 12px; padding: 6px 0; border-top: 1px solid var(--hairline); }
.source-row strong { display: block; margin-bottom: 2px; }
button.secondary { background: white; border: 1px solid var(--hairline); border-radius: 3px; padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: var(--font-body); }
</style>
</head>

<script id="kmap-data" type="application/json">{"projectName":"Game idea","nodes":[{"id":"8bb8108b-44e0-43e8-8f69-004606c4f83a","name":"Application Architecture","type":"topic","description":"How LOVE boots the game and routes every callback to a single active screen.","parentId":"eecbf04f-f99f-4a51-8f91-1ec16dbf839c","x":1348.3325259929923,"y":433.35092696764167},{"id":"557b68b9-0938-4e46-a530-aa7181eb07d5","name":"Bells","type":"concept","description":"Yellow. Effect on 'player_wins': +5 chips for every even-numbered card (2, 4, 6, 8, 10) in your hand.","parentId":"5b95ccc7-6a94-416c-ac42-7839faf187a5","x":5940,"y":760},{"id":"000d625c-2f5c-4ce6-8950-da4efe896255","name":"Bitmap font renderer","type":"concept","description":"FontRenderer.print(text, x, y, scale, spacing, maxCharacters) draws text from font.png (8x11 glyph cells, 16 per row). Text is upper-cased and only A-Z, digits and . ! ? : ; ' / \\ - | , $ are supported; other characters are skipped. Optional word wrap by character count.","parentId":"12c64387-f4ce-45b9-a4bc-f728c7a3a95b","x":6806.823191213539,"y":16.359818487999924},{"id":"e3d85e6e-2722-45d3-8fd4-03e58f5fd88b","name":"Blackjack Game","type":"concept","description":"The gameplay screen. Holds run state (Game.round, Game.chips, Game.ActiveSuits, Game.CurrentDeck, both hands, Game.phase) and runs a phase machine: player, dealer, then roundOver, or intermission on every 5th round. Input: HIT/STAY buttons (or H/S keys), Space for the next round, Continue/Cashout at intermission. One dealer card is hidden during the player's turn, and hovering one of your own cards shows a tooltip. Game.AvailableSuits is set on enter but never read.","parentId":"12adfc3c-f350-46bc-9d01-3d0d07192feb","x":2083.5460716257153,"y":52.06185242863266},{"id":"eecbf04f-f99f-4a51-8f91-1ec16dbf839c","name":"Blackjack but card suits provide different effects\n","type":"theme","description":"Cardsharp (LOVE 2D / Lua): a run-based blackjack game. Before each run you pick 4 owned suits to build the deck, and each suit brings its own effects or card-value tweaks. Chips earned during a run are cashed out into permanent cash, which buys more suits in the shop.","parentId":null,"x":4487.142857142857,"y":0},{"id":"54d87dcd-d520-4ea9-98d1-a5b1838eb573","name":"Bones","type":"concept","description":"White. 'value' modifier: J, Q and K count as 1 instead of 10.","parentId":"cbdd293f-924b-425d-8c35-b21ff97b0ce2","x":7190,"y":760},{"id":"12d2ff2a-8d02-4231-8ce2-32d49a537aeb","name":"Button","type":"concept","description":"Button.new(text, x, y, w, h, image, quad, scalex, scaley) is a plain table. It draws either a sprite (from a quad) or a brown rectangle, plus its label through the font renderer at scale 4. Button.isHovered is a rectangle test used by every screen for clicks and hover tooltips.","parentId":"12c64387-f4ce-45b9-a4bc-f728c7a3a95b","x":7737.596944696983,"y":7.968121991569156},{"id":"253d831e-526f-4398-ab79-469a1ff34045","name":"Card","type":"concept","description":"{rank, suit, color, sprite quad, spritesheet}. Base values: A = 11, K/Q/J = 10, number cards = face value. Card.getValue then runs that value through every 'value' modifier of the active suits. The sprite quad is cut from the suit's sheet (19x26 px cells; the column depends on the rank).","parentId":"c41fecc9-904e-423e-b739-179c74813cfc","x":4108.562764975499,"y":956.0317579220147},{"id":"ce49cbe8-2ea2-4d3c-a6b1-d6cdb9784dbb","name":"Card renderer","type":"concept","description":"Cardrenderer.draw(cards, x, y) lays cards out horizontally 60 px apart, layering the card back, the card base and the suit sprite (scaled x4 / x4.5). It stores each card's x, y, width and height so Cardrenderer.isHovered can hit-test the mouse for tooltips. A card without a sprite (the dealer's face-down placeholder) draws only the back.","parentId":"12c64387-f4ce-45b9-a4bc-f728c7a3a95b","x":7182.698638659999,"y":100.27678345230761},{"id":"3ce461e8-0130-437c-92c6-59ce94fbc426","name":"Cash (permanent currency)","type":"concept","description":"Player.cash. Gained by cashing out: floor(chips / 10). Spent in the shop at 15 per suit. Starts at 0 and is persisted in the save file.","parentId":"1e528fe4-c313-4014-abaf-8db3b6543d1e","x":5753.30695966719,"y":167.55514315142298},{"id":"a7971ddb-1770-4b2a-a680-b02466062d33","name":"Chips (run currency)","type":"concept","description":"Earned during a run: the base reward per round (win 10, tie 5, blackjack 15, loss 0) plus suit-effect bonuses via Game.addChips. Reset to 0 whenever a new run starts (Game.enter). They only count for anything once cashed out at an intermission.","parentId":"1e528fe4-c313-4014-abaf-8db3b6543d1e","x":5612.311624391661,"y":2.8410218997067673},{"id":"4cae04c2-7812-41af-8427-e7ff0209dd5f","name":"Clubs","type":"concept","description":"Black, starter suit. Effect on 'blackjack': +5 chips if the hand contains a J, Q or K. With no face card it awards nothing (it only prints a log line).","parentId":"ac7c20d4-a89c-4e0c-897f-3d141557a5b0","x":6940,"y":760},{"id":"f1d87ae2-8ffd-47b2-81ea-ca716c7c0491","name":"Code layout","type":"concept","description":"src/game = game logic and data (card, deck, hand, suit, suits, effect, modifier, player, save, state). src/states = the four screens. src/render = font and card drawing. src/ui = button. assets/cards and assets/ui = sprite sheets and backgrounds. Modules are plain Lua tables of functions with Module.new(...) constructors, not classes.","parentId":"8bb8108b-44e0-43e8-8f69-004606c4f83a","x":1610.0446026919694,"y":538.7637063639158},{"id":"c41fecc9-904e-423e-b739-179c74813cfc","name":"Core Data Model","type":"topic","description":"Plain-table representations of cards, decks and hands (src/game).","parentId":"eecbf04f-f99f-4a51-8f91-1ec16dbf839c","x":3486.3033864081813,"y":869.3004485406894},{"id":"31a9cc36-b7b8-4289-814e-fb2deb97da26","name":"Crowns","type":"concept","description":"Yellow. Adds an extra King (14 cards in the deck). Effect on 'player_wins': +5 chips if the hand contains a J, Q or K.","parentId":"5b95ccc7-6a94-416c-ac42-7839faf187a5","x":6190,"y":760},{"id":"c26a5fc3-d8eb-498f-81bd-e7b0286ab7ec","name":"Deal (startRound)","type":"concept","description":"Deals two cards each to player and dealer from the top of CurrentDeck, increments Game.round and sets phase = 'player'. Blackjack is not checked at the deal. Guard: if the deck is missing or has fewer than 4 cards, startRound just prints a message, reshuffles what is left and returns without dealing. The deck is never rebuilt mid-run, so a run can stall once the deck runs low.","parentId":"e1afcea4-1c2d-44d9-93e9-2adef28edd44","x":2495.7421095985414,"y":372.1919488673484},{"id":"7b64c1a7-54d1-4032-8be9-7a85388c2c0b","name":"Dealer turn","type":"concept","description":"Runs inside Game.update while phase == 'dealer'. The dealer draws until reaching 17 or more (modifiers included). Then: over 21 = 'player_wins' plus the extra 'dealer_bust' trigger; dealer higher = 'dealer_wins'; player higher = 'player_wins'; equal = 'tie'. It resolves in a single frame.","parentId":"e1afcea4-1c2d-44d9-93e9-2adef28edd44","x":3155.8071578178988,"y":383.9040255663258},{"id":"81f44c04-a481-4305-829c-fdd2be51ed92","name":"Deck","type":"concept","description":"Deck.new(suits) creates one card for every rank in each suit's ranks list, so suit definitions decide the deck's composition (Spades and Crowns have 14 cards, Moons only 9, the rest 13). shuffle is a Fisher-Yates using love.math.random; draw pops the top card. A deck is built once per run, when START is pressed.","parentId":"c41fecc9-904e-423e-b739-179c74813cfc","x":3555.2745047466033,"y":1037.1776369981767},{"id":"73569103-c7be-485d-a9bd-f9195cf6fdc5","name":"Deck-shape suits","type":"concept","description":"Change which cards exist in the deck: Spades (extra Ace) and Moons (2-10 only). Crowns also adds an extra King.","parentId":"bcb5fa3a-bf53-4cc7-aab1-6b7248960a6b","x":7815,"y":570},{"id":"cd44cabf-a643-4116-9950-1dec3e2f395a","name":"Diamonds","type":"concept","description":"Red, starter suit. Effect on 'dealer_bust': +1 to 3 chips (random). Fires only when the dealer busts.","parentId":"ac7c20d4-a89c-4e0c-897f-3d141557a5b0","x":6690,"y":760},{"id":"1e528fe4-c313-4014-abaf-8db3b6543d1e","name":"Economy & Persistence","type":"topic","description":"Two currencies, a rotating shop, and the save file.","parentId":"eecbf04f-f99f-4a51-8f91-1ec16dbf839c","x":5890.199611231836,"y":-113.21265231797061},{"id":"2fae6728-8e0d-43a8-ba29-cdbc9a959d3a","name":"Effects","type":"concept","description":"Effect.new(trigger, action) is an event-driven reaction. Effect.checkTriggers(suits, context, trigger) loops over the active suits and runs every matching effect's action(context). Effects mostly award bonus chips through context.game.addChips().","parentId":"4dedda50-5ab2-4484-a699-c7030b64b25d","x":4440,"y":380},{"id":"ac7c20d4-a89c-4e0c-897f-3d141557a5b0","name":"Event-trigger suits","type":"concept","description":"React to a specific outcome instead of any win: Diamonds (dealer bust) and Clubs (blackjack).","parentId":"bcb5fa3a-bf53-4cc7-aab1-6b7248960a6b","x":6815,"y":570},{"id":"4db823a3-1ae1-4e28-b695-e43dbdc3c00e","name":"Feathers","type":"concept","description":"White. Effect on 'player_wins': +5 chips if every card in the winning hand is white (Bones or Feathers).","parentId":"5b95ccc7-6a94-416c-ac42-7839faf187a5","x":5440,"y":760},{"id":"0ac07451-2bbd-4ee8-a887-d3735ae0812c","name":"Hand","type":"concept","description":"A plain array of cards. Hand.getValue sums modifier-adjusted card values, then downgrades aces from 11 to 1 one at a time while the total exceeds 21. containsAnyRank is the helper effects use to look for face cards. Hand.getCards builds text lines used for console logging.","parentId":"c41fecc9-904e-423e-b739-179c74813cfc","x":3811.781214023813,"y":900.5367421767736},{"id":"b22847b2-6d49-455e-bd8c-4faa0553e25e","name":"Hearts","type":"concept","description":"Red, starter suit. Effect on 'player_wins': +10 chips if every card in the winning hand is red (Hearts or Diamonds).","parentId":"5b95ccc7-6a94-416c-ac42-7839faf187a5","x":5190,"y":760},{"id":"249dbe1e-1e9b-4f7d-837f-96b66fcfc0e3","name":"Intermission (every 5th round)","type":"concept","description":"After rounds 5, 10, 15... the game pauses with two buttons. Continue deals the next round. Cashout converts chips into permanent cash (floor(chips / 10)), saves the profile and returns to the menu. This is the only way a run ends: losing a round just pays 0 chips.","parentId":"e1afcea4-1c2d-44d9-93e9-2adef28edd44","x":3783.3386596512087,"y":382.60268371088387},{"id":"f1355e32-27b1-4bc3-ad9f-641f989d4f2b","name":"Main Menu","type":"concept","description":"Title screen with PLAY and SHOP buttons and the player's permanent cash. PLAY goes to Suit Selection; SHOP goes to the Shop. Left-click only; the menu ignores the keyboard.","parentId":"12adfc3c-f350-46bc-9d01-3d0d07192feb","x":2677.9745720523815,"y":65.075270983052},{"id":"63a5fa95-62a1-4685-a900-146b1b0fb391","name":"Modifiers","type":"concept","description":"Modifier.new(trigger, action) is a pure value transform. Modifier.checkModifiers(suits, card, value, trigger) threads a card's value through every matching modifier of the active suits. Only the 'value' trigger is used, from Card.getValue.","parentId":"4dedda50-5ab2-4484-a699-c7030b64b25d","x":4703.314170059042,"y":437.69473692251734},{"id":"36f97393-0833-495e-903e-8912174780da","name":"Moons","type":"concept","description":"Black. Only ranks 2-10 (9 cards), so it strips Aces and face cards from the deck. No effect or modifier. Not exported by name from suits.lua; it is only reachable through Suits.AllSuits, which is enough for the shop and save/load.","parentId":"73569103-c7be-485d-a9bd-f9195cf6fdc5","x":7940,"y":760},{"id":"e7689b70-d812-48af-84f2-37e50be80fed","name":"Pentacles","type":"concept","description":"Yellow. Effect on 'player_wins': +chips equal to your final hand value (value modifiers included).","parentId":"5b95ccc7-6a94-416c-ac42-7839faf187a5","x":5690,"y":760},{"id":"3d6896e9-e9a4-4432-813b-d70db1f72a66","name":"Player","type":"concept","description":"player.lua holds the persistent profile: cash and ownedSuits. ownedSuits defaults to the four starter suits and is replaced by the saved profile on load. Owned suits are exactly what appears on the Suit Selection screen.","parentId":"1e528fe4-c313-4014-abaf-8db3b6543d1e","x":6093.0035732590095,"y":111.1799992466747},{"id":"b26302b5-ef0f-4c4b-a7ee-d6b3ab4c0a6a","name":"Player turn (Hit / Stay)","type":"concept","description":"HIT (H key or button) draws a card; a total over 21 ends the round as 'dealer_wins'. STAY (S key or button): exactly 21 with two cards resolves immediately as 'blackjack'; otherwise phase becomes 'dealer'. All totals include the active suits' value modifiers.","parentId":"e1afcea4-1c2d-44d9-93e9-2adef28edd44","x":2845.9454324675703,"y":377.39731628911613},{"id":"12c64387-f4ce-45b9-a4bc-f728c7a3a95b","name":"Rendering & UI","type":"topic","description":"Custom pixel-art drawing helpers: bitmap font, card drawing, buttons.","parentId":"eecbf04f-f99f-4a51-8f91-1ec16dbf839c","x":6888.113813838461,"y":-128.8844668643693},{"id":"e1afcea4-1c2d-44d9-93e9-2adef28edd44","name":"Round Flow","type":"topic","description":"One blackjack round, from the deal to the payout, as implemented in states/blackjack.lua.","parentId":"eecbf04f-f99f-4a51-8f91-1ec16dbf839c","x":3315.872206037257,"y":176.98658144558067},{"id":"5b319664-9285-4365-a90e-f92d761b8a91","name":"Round resolution (finishRound)","type":"concept","description":"Base chip rewards: player_wins 10, tie 5, blackjack 15, dealer_wins 0. Builds a context {playerHand, dealerHand, activeSuits, game} and fires suit effects for the result, then the optional extra trigger (e.g. dealer_bust), then 'round_over'. Bonus chips come from Game.addChips. A blackjack fires 'blackjack' effects but not 'player_wins' ones. Afterwards the phase is 'intermission' on every 5th round, otherwise 'roundOver' (Space deals the next round).","parentId":"e1afcea4-1c2d-44d9-93e9-2adef28edd44","x":3496.9010876988345,"y":365.68523959013874},{"id":"4e1e4ee7-7e4f-45e5-b59a-0e0414100e68","name":"Save system","type":"concept","description":"save.lua writes player/player_data.lua to LOVE's save directory as a Lua table (cash plus suit names). On load it runs that file and maps the names back to suit objects through Suits.AllSuits. It saves on first launch, after a shop purchase and after a cashout.","parentId":"1e528fe4-c313-4014-abaf-8db3b6543d1e","x":6189.170153951265,"y":-200.0790423927704},{"id":"12adfc3c-f350-46bc-9d01-3d0d07192feb","name":"Screens & Navigation","type":"topic","description":"The four screens (states) and how the player moves between them.","parentId":"eecbf04f-f99f-4a51-8f91-1ec16dbf839c","x":2006.695720277067,"y":199.10939298809353},{"id":"fc15c9bc-b6ad-45d5-8c3b-b81a81d4eeda","name":"Shop","type":"concept","description":"Screen for buying suits with permanent cash. Shows up to 3 suits in stock (see Shop stock & pricing). Click a suit to select it (green overlay), then press BUY. Too little cash shows a taunting message for 3 seconds. BACK or Return goes to the menu. The header reads 'Suits: 15$ a pop'.","parentId":"12adfc3c-f350-46bc-9d01-3d0d07192feb","x":1781.7771249183352,"y":52.061852428632676},{"id":"ff6ce736-600a-44cb-a0c5-6ab5865c7d16","name":"Shop stock & pricing","type":"concept","description":"Every suit costs 15 cash. Stock is 3 suits drawn from the non-starter suits the player does not own yet, picked with a date-seeded formula (seed = today's YYMMDD; index = seed mod pool size, then a linear-congruential step per pick). The same day gives the same stock, and it changes daily. Recomputed each time the Shop is entered. Bought suits are appended to Player.ownedSuits and saved.","parentId":"1e528fe4-c313-4014-abaf-8db3b6543d1e","x":6301.858013713136,"y":-54.08370711724125},{"id":"056a1886-9678-4670-8b50-4fc9bf76e591","name":"Spades","type":"concept","description":"Black, starter suit. Adds an extra Ace to the deck (14 cards). No effect or modifier.","parentId":"73569103-c7be-485d-a9bd-f9195cf6fdc5","x":7690,"y":760},{"id":"2c3388c4-9aea-4443-b6d1-cc3c0896b1c9","name":"Sprite sheets","type":"concept","description":"Suit art is indexed by spriteIndex. Per-suit card sheets use 19x26 cells in the order A, K, Q, J, 10, 9 ... 2. suitselect.png holds 32x32 icons (drawn x4); shopselect.png holds 90x112 icons, and the shop uses spriteIndex - 4 because the four starter suits are not sold. Backgrounds: menu_bg, game_bg, shop_bg.","parentId":"12c64387-f4ce-45b9-a4bc-f728c7a3a95b","x":7447.731136759938,"y":-159.86580793704627},{"id":"6299c379-f143-4818-b7bb-a1c73a7d098b","name":"Stars","type":"concept","description":"Yellow. 'value' modifier: every 5 counts as 10.","parentId":"cbdd293f-924b-425d-8c35-b21ff97b0ce2","x":7440,"y":760},{"id":"7a250828-9f85-422a-bc79-90a1aa13e9ba","name":"State manager","type":"concept","description":"state.lua holds State.current. State.switch(new) calls exit() on the old screen and enter() on the new one. update, draw, keypressed and mousepressed are forwarded to the current screen only if it defines them, so a screen implements just the callbacks it needs.","parentId":"8bb8108b-44e0-43e8-8f69-004606c4f83a","x":1334.017765583131,"y":536.161022653032},{"id":"f1f6195e-cf83-43d9-a4e5-2f93258102bc","name":"Suit","type":"concept","description":"Suit.new(name, description, ranks, color, spriteIndex) returns {id, name, description, ranks, color, effects[], modifiers[], image, spriteIndex}. Colour is a string (red, black, white, yellow) that colour-based effects compare against. spriteIndex (1-12) picks the suit's icon column in the suit-select and shop sheets; image loads assets/cards/\u003cname>.png.","parentId":"4dedda50-5ab2-4484-a699-c7030b64b25d","x":4190,"y":380},{"id":"bcb5fa3a-bf53-4cc7-aab1-6b7248960a6b","name":"Suit Catalogue","type":"concept","description":"All 12 suits are defined in suits.lua and collected in Suits.AllSuits. Starters: Hearts, Diamonds, Clubs, Spades. The other eight (Bones, Feathers, Stars, Pentacles, Bells, Crowns, Swords, Moons) are unlocked in the shop. Colours: red = Diamonds, Hearts; black = Spades, Clubs, Swords, Moons; white = Bones, Feathers; yellow = Stars, Pentacles, Bells, Crowns.","parentId":"4dedda50-5ab2-4484-a699-c7030b64b25d","x":6940,"y":380},{"id":"28de2f43-5ad0-4af8-97a6-cfcb1a6073aa","name":"Suit Selection","type":"concept","description":"Pre-run screen listing every suit in Player.ownedSuits as a grid of clickable icons (hover shows the suit's description). Clicking toggles a suit; at most 4 can be active and START appears only when exactly 4 are chosen. START builds and shuffles the deck from those suits, switches to the Game screen and deals the first round. Esc returns to the menu. The selection lives in SuitSelection.ActiveSuits, which is not cleared on enter and is the same table Game.ActiveSuits points to. This file also defines the global table.contains helper that Shop relies on.","parentId":"12adfc3c-f350-46bc-9d01-3d0d07192feb","x":2380.1096509113277,"y":70.28063840481973},{"id":"4dedda50-5ab2-4484-a699-c7030b64b25d","name":"Suit System","type":"topic","description":"The game's core hook: every suit can bring effects (react to round events) or modifiers (change card values).","parentId":"eecbf04f-f99f-4a51-8f91-1ec16dbf839c","x":5040,"y":190},{"id":"2fe0b7f9-892b-489d-8b8d-e6cfef05d75a","name":"Swords","type":"concept","description":"Black. Effect on 'player_wins': +5 chips for every odd-numbered card (3, 5, 7, 9) in your hand. Aces do not count.","parentId":"5b95ccc7-6a94-416c-ac42-7839faf187a5","x":6440,"y":760},{"id":"36b3ac11-f4c1-4bed-8a20-2b1d7a72f7a0","name":"Triggers & context","type":"concept","description":"Trigger names: player_wins, dealer_wins, tie, blackjack (the round result), dealer_bust (extra trigger when the dealer busts) and round_over (always fires last). Effect actions receive {playerHand, dealerHand, activeSuits, game}. No suit currently uses dealer_wins, tie or round_over.","parentId":"4dedda50-5ab2-4484-a699-c7030b64b25d","x":4854.095283827082,"y":530.6853218115111},{"id":"cbdd293f-924b-425d-8c35-b21ff97b0ce2","name":"Value-modifier suits","type":"concept","description":"Rewrite what cards are worth instead of paying chips: Bones (face cards = 1) and Stars (5s = 10).","parentId":"bcb5fa3a-bf53-4cc7-aab1-6b7248960a6b","x":7315,"y":570},{"id":"5b95ccc7-6a94-416c-ac42-7839faf187a5","name":"Win-bonus suits","type":"concept","description":"Fire on 'player_wins' and pay bonus chips based on the winning hand: Hearts, Feathers, Pentacles, Bells, Crowns, Swords.","parentId":"bcb5fa3a-bf53-4cc7-aab1-6b7248960a6b","x":5786.834519287569,"y":562.958629821892},{"id":"e04119fc-bfe9-48d3-934c-7c955b58563e","name":"main.lua (entry point)","type":"concept","description":"love.load restores the save. With no save file it seeds cash = 0 and the four starter suits (Hearts, Diamonds, Clubs, Spades) and writes a first save. It then loads the font sheet and switches to Menu. love.update/draw/keypressed/mousepressed just forward to State. main.lua sets nearest-neighbour filtering for crisp pixel art and loads anim8 as a global, but nothing uses anim8 yet. conf.lua sets the window: 'Suit Blackjack', 1280x720, resizable.","parentId":"8bb8108b-44e0-43e8-8f69-004606c4f83a","x":1065.798979606944,"y":534.85968079759}],"treeEdges":[{"source":"eecbf04f-f99f-4a51-8f91-1ec16dbf839c","target":"8bb8108b-44e0-43e8-8f69-004606c4f83a"},{"source":"5b95ccc7-6a94-416c-ac42-7839faf187a5","target":"557b68b9-0938-4e46-a530-aa7181eb07d5"},{"source":"12c64387-f4ce-45b9-a4bc-f728c7a3a95b","target":"000d625c-2f5c-4ce6-8950-da4efe896255"},{"source":"12adfc3c-f350-46bc-9d01-3d0d07192feb","target":"e3d85e6e-2722-45d3-8fd4-03e58f5fd88b"},{"source":"cbdd293f-924b-425d-8c35-b21ff97b0ce2","target":"54d87dcd-d520- <script>
(function () {
  var data = JSON.parse(document.getElementById("kmap-data").textContent);
  var nodesById = {};
  data.nodes.forEach(function (n) { nodesById[n.id] = n; });

  var CARD_W = 190, CARD_H = 90;
  var canvasArea = document.getElementById("canvas-area");
  var viewport = document.getElementById("viewport");
  var svg = document.getElementById("edge-svg");
  var nodesLayer = document.getElementById("nodes-layer");
  var labelsLayer = document.getElementById("labels-layer");
  var navList = document.getElementById("nav-list");

  var pan = { x: 40, y: 40 };
  var scale = 1;
  var selectedId = null;

  function applyTransform() {
    viewport.style.transform = "translate(" + pan.x + "px," + pan.y + "px) scale(" + scale + ")";
  }

  // ---- draw nodes ----
  data.nodes.forEach(function (n) {
    var el = document.createElement("div");
    el.className = "kmap-node" + (n.type === "theme" || n.type === "topic" ? " kmap-node-structural" : "");
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    el.style.setProperty("--stripe", "var(--n-" + n.type + ")");
    el.dataset.id = n.id;
    var desc = n.description && n.description.length > 90 ? n.description.slice(0, 89).trimEnd() + "\u2026" : n.description;
    el.innerHTML =
      '<div class="node-type">' + n.type + '</div>' +
      '<div class="node-name"></div>' +
      (desc ? '<div class="node-desc"></div>' : '');
    el.querySelector(".node-name").textContent = n.name;
    if (desc) el.querySelector(".node-desc").textContent = desc;
    el.addEventListener("click", function (ev) { ev.stopPropagation(); selectNode(n.id); });
    nodesLayer.appendChild(el);
  });

  // ---- draw edges (SVG) ----
  var svgParts = [];
  data.treeEdges.forEach(function (e) {
    var s = nodesById[e.source], t = nodesById[e.target];
    if (!s || !t) return;
    var x1 = s.x + CARD_W / 2, y1 = s.y + CARD_H, x2 = t.x + CARD_W / 2, y2 = t.y;
    var midY = (y1 + y2) / 2;
    svgParts.push('<path d="M' + x1 + ',' + y1 + ' C' + x1 + ',' + midY + ' ' + x2 + ',' + midY + ' ' + x2 + ',' + y2 + '" stroke="var(--hairline)" stroke-width="1.5" fill="none" />');
  });
  data.dataEdges.forEach(function (e) {
    var s = nodesById[e.source], t = nodesById[e.target];
    if (!s || !t) return;
    var x1 = s.x + CARD_W / 2, y1 = s.y + CARD_H, x2 = t.x + CARD_W / 2, y2 = t.y;
    var midY = (y1 + y2) / 2;
    svgParts.push('<path d="M' + x1 + ',' + y1 + ' C' + x1 + ',' + midY + ' ' + x2 + ',' + midY + ' ' + x2 + ',' + y2 + '" stroke="var(--n-concept)" stroke-width="1" stroke-dasharray="4 3" fill="none" />');
  });
  svg.innerHTML = svgParts.join("");
  svg.setAttribute("width", (data.bounds.maxX - data.bounds.minX + 200));
  svg.setAttribute("height", (data.bounds.maxY - data.bounds.minY + 200));

  data.dataEdges.forEach(function (e) {
    if (!e.label) return;
    var div = document.createElement("div");
    div.className = "edge-label";
    div.style.left = e.x + "px";
    div.style.top = e.y + "px";
    div.textContent = e.label;
    labelsLayer.appendChild(div);
  });

  // ---- detail panel ----
  var existingDrawer = null;
  function closeDrawer() {
    if (existingDrawer) { existingDrawer.remove(); existingDrawer = null; }
    if (selectedId) {
      var prev = nodesLayer.querySelector('[data-id="' + selectedId + '"]');
      if (prev) prev.classList.remove("selected");
    }
    selectedId = null;
  }

  function row(rel, name, onClick) {
    var d = document.createElement("div");
    d.className = "connection-row";
    if (onClick) d.style.cursor = "pointer";
    var relEl = document.createElement("div");
    relEl.className = "rel-type";
    relEl.textContent = rel;
    d.appendChild(relEl);
    d.appendChild(document.createTextNode(name));
    if (onClick) d.addEventListener("click", onClick);
    return d;
  }

  function selectNode(id) {
    var n = nodesById[id];
    var detail = data.details[id];
    if (!n || !detail) return;

    if (selectedId) {
      var prevEl = nodesLayer.querySelector('[data-id="' + selectedId + '"]');
      if (prevEl) prevEl.classList.remove("selected");
    }
    selectedId = id;
    var el = nodesLayer.querySelector('[data-id="' + id + '"]');
    if (el) el.classList.add("selected");

    if (existingDrawer) existingDrawer.remove();
    var drawer = document.createElement("div");
    drawer.className = "detail-drawer";

    var closeBtn = document.createElement("button");
    closeBtn.className = "secondary close-btn";
    closeBtn.textContent = "Close";
    closeBtn.addEventListener("click", closeDrawer);
    drawer.appendChild(closeBtn);

    var typeEl = document.createElement("div");
    typeEl.className = "node-type";
    typeEl.textContent = n.type;
    drawer.appendChild(typeEl);

    var h2 = document.createElement("h2");
    h2.textContent = n.name;
    drawer.appendChild(h2);

    if (n.description) {
      var p = document.createElement("p");
      p.textContent = n.description;
      drawer.appendChild(p);
    }

    if (detail.parent) {
      var lbl = document.createElement("div"); lbl.className = "section-label"; lbl.textContent = "Under";
      drawer.appendChild(lbl);
      drawer.appendChild(row(detail.parent.type, detail.parent.name, function () { selectNode(detail.parent.id); }));
    }

    if (detail.children.length) {
      var lbl2 = document.createElement("div"); lbl2.className = "section-label"; lbl2.textContent = "Contains (" + detail.children.length + ")";
      drawer.appendChild(lbl2);
      detail.children.forEach(function (c) { drawer.appendChild(row(c.type, c.name, function () { selectNode(c.id); })); });
    }

    if (detail.connections.length) {
      var lbl3 = document.createElement("div"); lbl3.className = "section-label"; lbl3.textContent = "Also relates to (" + detail.connections.length + ")";
      drawer.appendChild(lbl3);
      detail.connections.forEach(function (c) {
        var label = (c.direction === "out" ? (c.relationshipType + " \u2192 ") : ("\u2190 " + c.relationshipType + " ")) + c.node.name;
        var d = row(label, "");
        if (c.explanation) { var ex = document.createElement("div"); ex.textContent = c.explanation; d.appendChild(ex); }
        drawer.appendChild(d);
      });
    }

    if (detail.sources.length) {
      var lbl4 = document.createElement("div"); lbl4.className = "section-label"; lbl4.textContent = "Sources (" + detail.sources.length + ")";
      drawer.appendChild(lbl4);
      detail.sources.forEach(function (s) {
        var d = document.createElement("div"); d.className = "source-row";
        var strong = document.createElement("strong"); strong.textContent = s.title; d.appendChild(strong);
        if (s.excerpt) { var ex = document.createElement("div"); ex.textContent = s.excerpt; d.appendChild(ex); }
        drawer.appendChild(d);
      });
    }

    canvasArea.appendChild(drawer);
    existingDrawer = drawer;
  }

  // ---- main-ideas nav ----
  function subtreeIds(rootId) {
    var ids = {}; var stack = [rootId];
    while (stack.length) {
      var id = stack.pop();
      if (ids[id]) continue;
      ids[id] = true;
      data.nodes.forEach(function (n) { if (n.parentId === id) stack.push(n.id); });
    }
    return ids;
  }

  function boundsOfIds(ids) {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    data.nodes.forEach(function (n) {
      if (!ids[n.id]) return;
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + CARD_W); maxY = Math.max(maxY, n.y + CARD_H);
    });
    return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
  }

  function fitBounds(b, padding) {
    var w = canvasArea.clientWidth, h = canvasArea.clientHeight;
    var bw = (b.maxX - b.minX) + padding * 2, bh = (b.maxY - b.minY) + padding * 2;
    scale = Math.max(0.05, Math.min(2, Math.min(w / bw, h / bh)));
    pan.x = -((b.minX - padding) * scale) + (w - bw * scale) / 2;
    pan.y = -((b.minY - padding) * scale) + (h - bh * scale) / 2;
    applyTransform();
  }

  var navButtons = [];
  function setActiveNav(btn) {
    navButtons.forEach(function (b) { b.classList.remove("active"); });
    if (btn) btn.classList.add("active");
  }

  var wholeBtn = document.createElement("button");
  wholeBtn.className = "nav-item nav-root";
  wholeBtn.innerHTML = '<span>Whole map</span><span class="nav-count">' + data.nodes.length + '</span>';
  wholeBtn.addEventListener("click", function () { fitBounds(data.bounds, 60); setActiveNav(wholeBtn); });
  navList.appendChild(wholeBtn);
  navButtons.push(wholeBtn);

  data.topics.forEach(function (topicId) {
    var n = nodesById[topicId];
    var ids = subtreeIds(topicId);
    var count = Object.keys(ids).length - 1;
    var btn = document.createElement("button");
    btn.className = "nav-item";
    btn.innerHTML = '<span></span><span class="nav-count">' + count + '</span>';
    btn.querySelector("span").textContent = n.name;
    btn.addEventListener("click", function () { fitBounds(boundsOfIds(ids), 60); setActiveNav(btn); });
    navList.appendChild(btn);
    navButtons.push(btn);
  });

  // ---- pan / zoom ----
  var dragging = false, dragStart = null, panStart = null;
  canvasArea.addEventListener("mousedown", function (ev) {
    if (ev.target.closest(".kmap-node") || ev.target.closest(".detail-drawer") || ev.target.closest(".zoom-controls")) return;
    dragging = true;
    canvasArea.classList.add("dragging");
    dragStart = { x: ev.clientX, y: ev.clientY };
    panStart = { x: pan.x, y: pan.y };
  });
  window.addEventListener("mousemove", function (ev) {
    if (!dragging) return;
    pan.x = panStart.x + (ev.clientX - dragStart.x);
    pan.y = panStart.y + (ev.clientY - dragStart.y);
    applyTransform();
  });
  window.addEventListener("mouseup", function () { dragging = false; canvasArea.classList.remove("dragging"); });

  canvasArea.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var factor = ev.deltaY < 0 ? 1.1 : 0.9;
    var rect = canvasArea.getBoundingClientRect();
    var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    var newScale = Math.max(0.05, Math.min(2.5, scale * factor));
    pan.x = mx - ((mx - pan.x) / scale) * newScale;
    pan.y = my - ((my - pan.y) / scale) * newScale;
    scale = newScale;
    applyTransform();
  }, { passive: false });

  document.getElementById("zoom-in").addEventListener("click", function () { scale = Math.min(2.5, scale * 1.2); applyTransform(); });
  document.getElementById("zoom-out").addEventListener("click", function () { scale = Math.max(0.05, scale / 1.2); applyTransform(); });
  document.getElementById("zoom-fit").addEventListener("click", function () { fitBounds(data.bounds, 60); setActiveNav(wholeBtn); });

  window.addEventListener("resize", function () { fitBounds(data.bounds, 60); });
  fitBounds(data.bounds, 60);
  setActiveNav(wholeBtn);
})();
</script>
